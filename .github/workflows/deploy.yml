name: Deploy Shinylive App
on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R Packages
        run: |
          install.packages("remotes")
          install.packages(c("shinylive", "shiny", "ggplot2", "bslib", "munsell", "commonmark", "gld", "Markdown"))
        shell: Rscript {0}

      - name: Export App
        run: |
          rm -rf site
          Rscript -e 'shinylive::export(appdir = "myapp", destdir = "site")'
          touch site/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site' # Points to the folder we just created

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
